# Builds the .deb, signs an APT repository and publishes it on GitHub Pages.
# One-time setup (see README "Publikasi APT repository"):
#   - Secret  APT_GPG_PRIVATE_KEY : armored private key of the repo signing key
#   - Settings -> Pages -> Source: GitHub Actions
#   - optional variable APT_REPO_URL to use a custom domain
name: APT repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-pango-1.0 gir1.2-gdkpixbuf-2.0

      - name: Tests
        run: python3 tests/test_document.py

      - name: Build .deb
        run: ./packaging/deb/build-deb.sh

      - name: Import signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          test -n "$APT_GPG_PRIVATE_KEY" || { echo "::error::Secret APT_GPG_PRIVATE_KEY is not set"; exit 1; }
          echo "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          echo "APT_SIGNING_KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')" >> "$GITHUB_ENV"

      - name: Build APT repository
        env:
          CUSTOM_URL: ${{ vars.APT_REPO_URL }}
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          export REPO_URL="${CUSTOM_URL:-https://$owner.github.io/${{ github.event.repository.name }}}"
          python3 packaging/apt/build-repo.py --out public

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
